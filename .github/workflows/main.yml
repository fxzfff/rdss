name: Linux RDP

on:
  workflow_dispatch:

env:
  # Change this password before using, or preferably replace it with a GitHub Secret.
  RDP_PASSWORD: "YourSecurePassword123!"

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop and XRDP
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11

          echo "xfce4-session" | sudo tee /etc/skel/.xsession

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Create RDP User
        shell: bash
        run: |
          set -e

          USERNAME="rdp"

          if id "$USERNAME" >/dev/null 2>&1; then
            sudo userdel -r "$USERNAME" || true
          fi

          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"

          echo "xfce4-session" | sudo tee /home/$USERNAME/.xsession
          sudo chown "$USERNAME:$USERNAME" /home/$USERNAME/.xsession

          # Allow passwordless sudo for this temporary runner user.
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/$USERNAME
          sudo chmod 440 /etc/sudoers.d/$USERNAME

      - name: Configure XRDP
        shell: bash
        run: |
          set -e

          # XRDP listens on TCP 3389 by default.
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini

          # Add xrdp user to ssl-cert group when available.
          sudo adduser xrdp ssl-cert || true

          sudo systemctl restart xrdp
          sudo systemctl --no-pager --full status xrdp || true

      - name: Install Tailscale
        shell: bash
        run: |
          set -e
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="gh-linux-${GITHUB_RUN_ID}"

          TS_IP=""
          for i in {1..10}; do
            TS_IP="$(tailscale ip -4 | head -n1 || true)"
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify RDP Accessibility
        shell: bash
        run: |
          set -e

          echo "Tailscale IP: $TAILSCALE_IP"

          for i in {1..12}; do
            if nc -z "$TAILSCALE_IP" 3389; then
              echo "RDP port 3389 is reachable."
              exit 0
            fi
            sleep 5
          done

          echo "RDP port 3389 is not reachable."
          exit 1

      - name: Maintain Connection
        shell: bash
        run: |
          echo ""
          echo "========== LINUX RDP ACCESS =========="
          echo "Address : $TAILSCALE_IP"
          echo "Username: rdp"
          echo "Password: $RDP_PASSWORD"
          echo "Desktop : XFCE"
          echo "Port    : 3389"
          echo "======================================"
          echo ""

          while true; do
            echo "[$(date)] Linux RDP Active - cancel workflow to stop"
            sleep 300
          done
          
