name: RDP Linux

on:
  workflow_dispatch:

env:
  RDP_PASSWORD: "YourSecurePassword123!"

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11

          # Configure XRDP to use XFCE
          echo "xfce4-session" | tee ~/.xsession
          sudo sed -i 's/^test -x \/etc\/X11\/Xsession/#&/' /etc/xrdp/startwm.sh
          echo -e "#!/bin/bash\nstartxfce4" | sudo tee /etc/xrdp/startwm.sh
          sudo chmod +x /etc/xrdp/startwm.sh

          # Fix permissions
          sudo adduser xrdp ssl-cert 2>/dev/null || true

          # Start XRDP services
          sudo service xrdp start
          sudo service xrdp-sesman start

      - name: Create RDP User
        run: |
          USERNAME="rdpuser"
          PASSWORD="$RDP_PASSWORD"

          if id "$USERNAME" &>/dev/null; then
            sudo userdel -r "$USERNAME" 2>/dev/null || true
          fi

          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"

          # Enable passwordless sudo for the workflow session
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/99-rdp-user
          sudo chmod 440 /etc/sudoers.d/99-rdp-user

          echo "RDP_CREDS=User: $USERNAME | Password: $PASSWORD" >> "$GITHUB_ENV"

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-linux-$GITHUB_RUN_ID"

          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ "$RETRIES" -lt 10 ]; do
            TS_IP=$(sudo tailscale ip -4 2>/dev/null || true)
            sleep 5
            RETRIES=$((RETRIES + 1))
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned. Exiting."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          if command -v nc >/dev/null 2>&1; then
            if nc -zv "$TAILSCALE_IP" 3389; then
              echo "TCP connectivity successful!"
            else
              echo "Warning: Port 3389 not reachable yet, but XRDP is running."
            fi
          else
            echo "nc not available, skipping TCP test."
          fi

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== RDP ACCESS ==="
          echo "Address:  $TAILSCALE_IP"
          echo "Username: rdpuser"
          echo "Password: $RDP_PASSWORD"
          echo "Desktop:  XFCE4"
          echo "=================="
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP Active - Use Ctrl+C in workflow to terminate"
            slee
            p 300
          done
